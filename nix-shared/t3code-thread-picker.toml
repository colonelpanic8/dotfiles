# GROUP manifest: the command-palette / new-thread-picker cluster.
#
# These four PRs all edit the same CommandPalette.logic.ts / .tsx /
# .logic.test.ts trio, and every substantive conflict in the main stack came
# from combining them. Merging them here -- against upstream main -- means the
# combination is resolved once against a STABLE base, instead of being
# re-derived against a shifting assembled stack on every refresh.
#
# The output branch is pinned as a single `kind = "fork"` entry in
# t3code-stack.toml. Same tool, two levels; a subsystem tree, in linux-next
# terms.
#
# Deliberately NOT in this group:
#   #4271, #4277  share only keybindings.ts, where conflicts are additive
#                 one-line registry entries -- not worth coupling.
#   #4259         "new thread picker" by name, but touches none of these files.
#   #4401, #4474  touch CommandPalette.tsx incidentally (one file each).
#
# Rebuild:
#   rebuild-t3code-stack.py --manifest nix-shared/t3code-thread-picker.toml \
#       --mode reproduce --write-lock --push

upstream = "https://github.com/pingdotgg/t3code"
upstream_ref = "main"
fork = "https://github.com/colonelpanic8/t3code"
integration_branch = "t3code/group/thread-picker"
tag_prefix = "t3code-thread-picker"

[[entry]]
pr = 4263
kind = "fork"
branch = "t3code/replace-ctrl-n-thread-modal"
pin = "ef15fa2ea50b"
summary = "Unify the new thread project picker"

[[entry]]
pr = 4257
kind = "fork"
branch = "t3code/directory-path-tab-completion"
pin = "ee5da25a75f9"
summary = "Directory path tab completion"

[[entry]]
pr = 4258
kind = "fork"
branch = "t3code/add-project-shortcut"
pin = "88cfcca843ba"
summary = "Add configurable add-project shortcut"

[[entry]]
pr = 4426
kind = "fork"
branch = "t3code/remote-environment-thread-creation"
pin = "a93d1ea2a700"
summary = "Add environment-aware new thread picker"

# ---------------------------------------------------------------------------
# The glue. This is what the four need in order to COEXIST, so it belongs here
# rather than in any single PR or as a stack epilogue -- which is exactly where
# it was stranded before (nixos/patches/t3code-pr-4426-stack-compat.patch).
# ---------------------------------------------------------------------------

[[epilogue]]
patch = "patches/t3code-command-palette-logic-helpers.patch"
summary = "Command-palette add-project flow helpers"
note = """
Adds shouldResetPaletteFlowOnPop, shouldIgnoreAddProjectShortcut and
resetAddProjectFlowState, and aligns resolveNewThreadOnIntent with the combined
CommandPalette.tsx. Together these keep the add-project flow from leaking state
across palette navigation once all four PRs are stacked.

Original local work: no topic branch defines it, so merging alone can never
recover it. The main-stack build caught its absence because CommandPalette.tsx
imports all three symbols.
"""
