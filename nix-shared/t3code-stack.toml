ref = "refs/pull/3984/head"
pin = "690d45fdd7a903911b5ea47c5dbce6469def10c6"
summary = "Render generated images inline in chat"
note = "External (jakeleventhal). Cannot rebase; merged from the PR head."

[[entry]]
kind = "local"
branch = "t3code/local/artifact-safety"
pin = "2593d03a2"
summary = "Constrain #3984's generic artifact paths to the real thread workspace"
note = """
Only typed image-generation paths may use provider-managed storage. Also adds
transactional thread snapshots, correct streaming boundaries, and a bounded
retry for projection/file visibility races. Was nix-shared/patches/t3code-pr-3984-artifact-safety.patch.
"""

