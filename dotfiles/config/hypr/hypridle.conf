general {
    # DMS answers logind lock requests itself; hyprlock covers Taffybar.
    lock_cmd = [ "$(desktop_shell_ui current)" = dms ] || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# Disabled 2026-08-18: a hyprsaver wedged by a monitor going away ignored
# --quit and SIGTERM while holding its exclusive keyboard grab, leaving the
# session unable to focus any window until it was SIGKILLed.
# listener {
#     timeout = 300
#     on-timeout = hypr-screensaver start
#     on-resume = hypr-screensaver stop
# }

# Blank the (OLED) monitors instead; DPMS holds no keyboard grab to wedge.
# Under DMS its acMonitorTimeout/batteryMonitorTimeout blank the monitors.
listener {
    timeout = 600
    on-timeout = [ "$(desktop_shell_ui current)" = dms ] || hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = [ "$(desktop_shell_ui current)" = dms ] || hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
